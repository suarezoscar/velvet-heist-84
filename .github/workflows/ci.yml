name: CI

on:
  push:
    branches: [ master, main, feat/*, chore/*, fix/* ]
  pull_request:
    branches: [ master, main ]

env:
  # Base para "archivos cambiados" (lint, patrones). En PR, la rama destino; en push, master.
  BASE_REF: origin/${{ github.base_ref || 'master' }}
  # Rama analizada por check_scope.py (en PR, la rama origen).
  SCOPE_BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  verify:
    name: Verification Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Load Pinned Versions
        run: |
          grep -hE '^[A-Z_]+=' tools/ci/godot_version.env tools/ci/blender_version.env >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install gdtoolkit==4.5.0

      - name: Package Scope and Ownership
        run: |
          python3 tools/ci/check_scope.py

      - name: Forbidden Patterns (changed files)
        run: |
          ./tools/ci/check_patterns.sh

      - name: Lint & Formatting (changed files, blocking)
        run: |
          ./tools/ci/lint.sh

      - name: Lint Report (whole project, non-blocking)
        run: |
          ./tools/ci/lint.sh --all

      - name: Cache Godot Binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Headless Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          GODOT_URL="https://downloads.tuxfamily.org/godotengine/${GODOT_VERSION}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          GITHUB_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          
          mkdir -p /tmp/godot
          if curl -sLf "${GITHUB_URL}" -o /tmp/godot/godot.zip; then
            echo "Downloaded from GitHub Releases"
          elif curl -sLf "${GODOT_URL}" -o /tmp/godot/godot.zip; then
            echo "Downloaded from TuxFamily"
          else
            echo "Falling back to official Godot releases"
            curl -sLf "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot/godot.zip || true
          fi
          
          if [ -f /tmp/godot/godot.zip ]; then
            unzip -q /tmp/godot/godot.zip -d /tmp/godot
            sudo mv /tmp/godot/Godot_v* /usr/local/bin/godot
            sudo chmod +x /usr/local/bin/godot
          fi

      - name: Check Godot Executable
        run: |
          if ! command -v godot >/dev/null 2>&1; then
            echo "::error::Godot no está instalado"
            exit 1
          fi
          GODOT_FOUND="$(godot --version)"
          echo "${GODOT_FOUND}"
          if [[ "${GODOT_FOUND}" != "${GODOT_VERSION}"* ]]; then
            echo "::error::Se esperaba Godot ${GODOT_VERSION}"
            exit 1
          fi

      - name: Step 1 - Headless Project Import
        run: |
          ./tools/ci/import.sh

      - name: Step 2 - GDScript Syntax and Class Verification
        run: |
          ./tools/ci/check_scripts.sh

      - name: Step 3 - Run GUT Characterization Tests
        run: |
          ./tools/ci/run_tests.sh

      - name: Install Blender System Libraries
        run: |
          sudo apt-get update && sudo apt-get install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: /opt/blender
          key: blender-${{ env.BLENDER_VERSION }}

      - name: Install Blender ${{ env.BLENDER_VERSION }}
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          curl -sLf "https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" -o /tmp/blender.tar.xz
          sudo mkdir -p /opt/blender
          sudo tar -xJf /tmp/blender.tar.xz -C /opt/blender --strip-components=1

      - name: Check Blender Executable
        run: |
          sudo ln -sf /opt/blender/blender /usr/local/bin/blender
          BLENDER_FOUND="$(blender --version 2>/dev/null | sed -n 1p)"
          echo "${BLENDER_FOUND}"
          if [[ "${BLENDER_FOUND}" != "Blender ${BLENDER_VERSION}"* ]]; then
            echo "::error::Se esperaba Blender ${BLENDER_VERSION}"
            exit 1
          fi

      - name: Step 4 - Asset Validator Tests
        run: |
          ./tools/ci/run_blender_tests.sh
