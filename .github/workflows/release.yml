name: Release

# Publica una versión descargable del juego (FEAT-023): exporta Linux y Windows y sube los
# paquetes a GitHub Releases. Se lanza al subir una etiqueta vX.Y.Z, o a mano desde la pestaña
# Actions («Run workflow») indicando la versión; en ese caso la etiqueta se crea sobre el commit
# elegido. La versión de la etiqueta se graba en el juego (menú, LEEME y nombre del paquete).

on:
  push:
    tags: [ "v[0-9]+.[0-9]+.[0-9]+*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión sin la v (por ejemplo 0.2.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Load Pinned Versions
        run: |
          grep -hE '^[A-Z_]+=' tools/ci/godot_version.env >> "$GITHUB_ENV"

      - name: Resolve Game Version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${INPUT_VERSION#v}"
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Versión no válida: '${VERSION}' (se espera X.Y.Z o X.Y.Z-algo)"
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]] && git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::La etiqueta v${VERSION} ya existe"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Versión: ${VERSION}"

      - name: Cache Godot Binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Headless Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/godot
          curl -sLf "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE_TAG}/Godot_v${GODOT_RELEASE_TAG}_linux.x86_64.zip" -o /tmp/godot/godot.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          sudo mv /tmp/godot/Godot_v* /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

      - name: Check Godot Executable
        run: |
          GODOT_FOUND="$(godot --version)"
          echo "${GODOT_FOUND}"
          if [[ "${GODOT_FOUND}" != "${GODOT_VERSION}."* ]]; then
            echo "::error::Se esperaba Godot ${GODOT_VERSION}"
            exit 1
          fi

      - name: Cache Export Templates
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Install Export Templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          ./tools/build/install_templates.sh

      - name: Import and Test
        run: |
          ./tools/ci/import.sh
          ./tools/ci/run_tests.sh

      - name: Export Linux and Windows
        run: |
          ./tools/build/export.sh all
          ls -la build/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/notes.md <<EOF
          ## Descargar
          - **Windows**: \`VelvetHeist84-${VERSION}-windows.zip\`. Descomprime y abre \`VelvetHeist84.exe\` (SmartScreen avisa porque no está firmado: «Más información» → «Ejecutar de todos modos»).
          - **Linux**: \`VelvetHeist84-${VERSION}-linux.tar.gz\`. \`tar -xzf\` y \`./linux/VelvetHeist84.x86_64\`.

          El servidor dedicado es el mismo ejecutable: \`servidor.bat\` o \`./servidor.sh\` dentro del paquete. Todos los jugadores y el servidor deben usar la misma versión.
          EOF
          PRERELEASE=""
          if [[ "${VERSION}" == *-* ]]; then PRERELEASE="--prerelease"; fi
          gh release create "v${VERSION}" \
            build/VelvetHeist84-${VERSION}-linux.tar.gz \
            build/VelvetHeist84-${VERSION}-windows.zip \
            --title "Velvet Heist '84 v${VERSION}" \
            --notes-file /tmp/notes.md \
            --generate-notes \
            --target "${GITHUB_SHA}" ${PRERELEASE}
