name: Release

# Publica una versión descargable del juego (FEAT-023): exporta Linux y Windows y sube los
# paquetes a GitHub Releases, creando la etiqueta vX.Y.Z sobre el commit. Se lanza:
#   - sola, con cada integración en master que no sea solo documentación: la versión la da
#     tools/build/next_version.sh (sube el último número; cambiar config/version da el salto);
#   - al subir a mano una etiqueta vX.Y.Z;
#   - desde la pestaña Actions («Run workflow») indicando la versión.
# La versión se graba en el juego (menú, panel F9, LEEME y nombre del paquete). La web (site/)
# no lanza una release: la publica pages.yml.
# Velopack (FEAT-036) añade el instalador de Windows, el AppImage de Linux y los paquetes e
# índices con los que el juego se actualiza desde el menú (tools/build/velopack.sh).

on:
  push:
    branches: [ master ]
    tags: [ "v[0-9]+.[0-9]+.[0-9]+*" ]
    paths-ignore: [ "docs/**", "**/*.md", "site/**", ".github/workflows/pages.yml" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión sin la v (por ejemplo 0.2.0)"
        required: true

permissions:
  contents: write

# Una release detrás de otra, para que dos integraciones seguidas no pidan la misma versión
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Los binarios van en Git LFS: se guardan en caché para no gastar la cuota de descarga
      # de GitHub en cada ejecución; solo se bajan de nuevo si cambia algún asset
      - name: List LFS Objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS Cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-

      - name: Pull LFS Objects
        run: git lfs pull

      - name: Load Pinned Versions
        run: |
          grep -hE '^[A-Z_]+=' tools/ci/godot_version.env >> "$GITHUB_ENV"

      - name: Resolve Game Version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          git fetch --tags --force --quiet
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="$(./tools/build/next_version.sh)"
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Versión no válida: '${VERSION}' (se espera X.Y.Z o X.Y.Z-algo)"
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]] && git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::La etiqueta v${VERSION} ya existe"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Versión: ${VERSION}"

      - name: Cache Godot Binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Headless Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/godot
          curl -sLf "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE_TAG}/Godot_v${GODOT_RELEASE_TAG}_linux.x86_64.zip" -o /tmp/godot/godot.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          sudo mv /tmp/godot/Godot_v* /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

      - name: Check Godot Executable
        run: |
          GODOT_FOUND="$(godot --version)"
          echo "${GODOT_FOUND}"
          if [[ "${GODOT_FOUND}" != "${GODOT_VERSION}."* ]]; then
            echo "::error::Se esperaba Godot ${GODOT_VERSION}"
            exit 1
          fi

      - name: Cache Export Templates
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Install Export Templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          ./tools/build/install_templates.sh

      - name: Import and Test
        run: |
          ./tools/ci/import.sh
          ./tools/ci/run_tests.sh

      - name: Export Linux and Windows
        run: |
          ./tools/build/export.sh all
          ls -la build/

      - name: Install Velopack
        run: |
          sudo apt-get install -y -qq squashfs-tools
          dotnet tool install -g vpk --version "${VPK_VERSION}"
          echo "${HOME}/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Package with Velopack
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./tools/build/velopack.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/notes.md <<EOF
          ## Descargar
          - **Windows**: \`VelvetHeist84-win-Setup.exe\`. Ábrelo: el juego se instala y se abre solo (SmartScreen avisa porque no está firmado: «Más información» → «Ejecutar de todos modos»).
          - **Linux**: \`VelvetHeist84.AppImage\`. Dale permiso de ejecución (\`chmod +x VelvetHeist84.AppImage\`) y ábrelo.

          Cuando salga una versión, el menú principal te avisará y la instalará sin que tengas que bajar nada más.

          Si prefieres no instalar nada: \`VelvetHeist84-${VERSION}-windows.zip\` (descomprime y abre \`VelvetHeist84.exe\`) o \`VelvetHeist84-${VERSION}-linux.tar.gz\` (\`tar -xzf\` y \`./linux/VelvetHeist84.x86_64\`). Estos no se actualizan solos.

          Para organizar una partida en red, abre \`servidor.bat\` (Windows) o \`./servidor.sh\` (Linux), que vienen en los paquetes .zip y .tar.gz, y pasa tu IP y el puerto a los demás. Todos tenéis que usar la misma versión del juego.
          EOF
          PRERELEASE=""
          if [[ "${VERSION}" == *-* ]]; then PRERELEASE="--prerelease"; fi
          V=build/velopack
          gh release create "v${VERSION}" \
            "${V}/VelvetHeist84-win-Setup.exe" \
            "${V}/VelvetHeist84.AppImage" \
            "${V}/releases.win.json" \
            "${V}/releases.linux.json" \
            "${V}"/VelvetHeist84-${VERSION}-*.nupkg \
            build/VelvetHeist84-${VERSION}-linux.tar.gz \
            build/VelvetHeist84-${VERSION}-windows.zip \
            --title "Velvet Heist '84 v${VERSION}" \
            --notes-file /tmp/notes.md \
            --generate-notes \
            --target "${GITHUB_SHA}" ${PRERELEASE}
